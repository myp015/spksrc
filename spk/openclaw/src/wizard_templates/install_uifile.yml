CONFIGURATION_TITLE: "OpenClaw 安装参数（容器版）"

HOME_DESCRIPTION: "HOME 目录（默认 /volume1/openclaw）。所有 OpenClaw 文件都位于 HOME/.openclaw（配置 openclaw.json、运行时、脚本、工作区）。套件脚本以非 root 运行，无法新建顶层目录：HOME 必须已存在且对套件可写（全新安装请先以 root 创建并赋权，例如：mkdir /volume1/openclaw && chown sc-openclaw /volume1/openclaw；或选择 /volume1/docker 下等可写目录）"
HOME_LABEL: "HOME 目录"

GATEWAY_PORT_DESCRIPTION: "Gateway 监听端口（默认 58789，容器将映射到此端口）"
GATEWAY_PORT_LABEL: "端口"

INSTALLATION_NOTES_TITLE: "<b>说明</b><br/>"
INSTALLATION_NOTES_TEXT1: "OpenClaw 以 Docker 容器方式运行（需已安装 Docker/Container Manager 套件）。镜像固定，OpenClaw 本体在容器内自动在线更新，无需重新编译本套件。"
