name: Build CLIProxy SPK

on:
  push:
    branches:
      - master
    paths:
      - 'spk/cliproxy/**'
      - '.github/workflows/build-cliproxy.yml'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to build (e.g. 7.2.147). Leave empty to build the latest stable release.'
        required: false
        default: ''
      target_arch:
        description: 'Target arch (e.g. x64-7.2, x64-6.2.4, armv8-7.2, noarch-7.2)'
        required: false
        default: 'x64-7.2'
  # Periodically rebuild against the latest stable upstream release. The
  # Makefile resolves the newest version via src/resolve-versions.sh at build
  # time, so a scheduled run picks up upstream updates automatically.
  schedule:
    - cron: '0 3 * * *'   # daily at 03:00 UTC

jobs:
  build-cliproxy:
    name: Build cliproxy (${{ github.event.inputs.target_arch || 'x64-7.2' }})
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Resolve version
        id: version
        run: |
          if [ -n "${{ github.event.inputs.version }}" ]; then
            echo "VERSION=${{ github.event.inputs.version }}" >> "$GITHUB_OUTPUT"
          else
            V=$(sh spk/cliproxy/src/resolve-versions.sh | sed -n 's/^SPK_VERSION=//p')
            echo "Resolved latest cliproxy version: $V"
            echo "VERSION=$V" >> "$GITHUB_OUTPUT"
          fi

      - name: Cache toolchains
        uses: actions/cache@v4
        with:
          path: toolchain/*/work
          key: toolchain-cliproxy-v1-${{ hashFiles('toolchain/*/digests') }}

      - name: Build cliproxy package
        uses: docker://ghcr.io/synocommunity/spksrc:latest
        env:
          SPK_VERS: ${{ steps.version.outputs.VERSION }}
          PKG_VERS: ${{ steps.version.outputs.VERSION }}
        with:
          entrypoint: /bin/bash
          args: -lc "set -e; cd /github/workspace/spk/cliproxy && make V=s arch-${{ github.event.inputs.target_arch || 'x64-7.2' }}"

      - name: Upload SPK artifact
        uses: actions/upload-artifact@v4
        with:
          name: cliproxy-${{ github.event.inputs.target_arch || 'x64-7.2' }}-${{ steps.version.outputs.VERSION }}
          path: packages/cliproxy_*.spk
          if-no-files-found: error

      - name: Upload build logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cliproxy-${{ github.event.inputs.target_arch || 'x64-7.2' }}-logs
          path: |
            spk/cliproxy/work-*/doctor.log
            spk/cliproxy/status-build.log
            spk/cliproxy/build-*.log
          if-no-files-found: warn
