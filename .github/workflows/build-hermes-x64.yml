name: Build Hermes SPK (x64-7.2)

on:
  push:
    branches:
      - master
    paths:
      - 'spk/hermes/**'
      - '.github/workflows/build-hermes-x64.yml'
  workflow_dispatch:
    inputs:
      ref:
        description: 'Git ref to build (branch/tag/SHA)'
        required: false
        default: 'master'

jobs:
  build-hermes-x64:
    name: Build hermes (x64-7.2)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event.inputs.ref || 'master' }}
          fetch-depth: 0

      - name: Cache toolchains
        uses: actions/cache@v5
        with:
          path: toolchain/*/work
          key: toolchain-x64-7.2-hermes-v1-${{ hashFiles('toolchain/syno-x64-7.2/digests') }}

      - name: Build hermes package
        uses: docker://ghcr.io/synocommunity/spksrc:latest
        with:
          entrypoint: /bin/bash
          args: -lc "set -e; cd /github/workspace/spk/hermes && make arch-x64-7.2"

      - name: Upload SPK artifact
        uses: actions/upload-artifact@v6
        with:
          name: hermes-x64-7.2
          path: packages/hermes_x64-7.2_*.spk
          if-no-files-found: error
