name: Build Hermes SPK (aarch64-7.2)

on:
  workflow_dispatch:
    inputs:
      ref:
        description: 'Git ref to build (branch/tag/SHA)'
        required: false
        default: 'master'

jobs:
  build-hermes-aarch64:
    name: Build hermes (aarch64-7.2)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event.inputs.ref || 'master' }}
          fetch-depth: 0

      - name: Cache toolchains
        uses: actions/cache@v5
        with:
          path: toolchain/*/work
          key: toolchain-aarch64-7.2-hermes-v1-${{ hashFiles('toolchain/syno-aarch64-7.2/digests') }}

      - name: Clean Rust target (avoid conflict from cached toolchain)
        uses: docker://ghcr.io/synocommunity/spksrc:latest
        with:
          entrypoint: /bin/bash
          args: -lc "set -e; rustup target remove aarch64-unknown-linux-gnu 2>/dev/null || true; rm -rf /spksrc/distrib/cargo /spksrc/distrib/rustup 2>/dev/null || true"

      - name: Build hermes package
        uses: docker://ghcr.io/synocommunity/spksrc:latest
        with:
          entrypoint: /bin/bash
          args: -lc "set -e; cd /github/workspace/spk/hermes && make arch-aarch64-7.2"

      - name: Upload SPK artifact
        uses: actions/upload-artifact@v6
        with:
          name: hermes-aarch64-7.2
          path: packages/hermes_aarch64-7.2_*.spk
          if-no-files-found: error
