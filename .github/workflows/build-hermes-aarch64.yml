name: Build Hermes Agent SPK (aarch64-7.2)

on:
  push:
    branches:
      - master
    paths:
      - 'spk/hermes/**'
      - '.github/workflows/build-hermes-aarch64.yml'
  workflow_dispatch:
    inputs:
      ref:
        description: 'Git ref to build (branch/tag/SHA)'
        required: false
        default: ''

jobs:
  build-hermes-aarch64:
    name: Build hermes (aarch64-7.2)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.ref != '' && github.event.inputs.ref || github.sha }}
          fetch-depth: 0

      - name: Cache toolchains
        uses: actions/cache@v4
        with:
          path: toolchain/*/work
          key: toolchain-aarch64-7.2-hermes-v1-${{ hashFiles('toolchain/syno-aarch64-7.2/digests') }}

      - name: Build hermes package
        uses: docker://ghcr.io/synocommunity/spksrc:latest
        with:
          entrypoint: /bin/bash
          args: -lc "set -e; cd /github/workspace/spk/hermes && make V=s arch-aarch64-7.2"

      - name: Upload SPK artifact
        uses: actions/upload-artifact@v4
        with:
          name: hermes-aarch64-7.2
          path: packages/hermes_aarch64-7.2_*.spk
          if-no-files-found: error

      - name: Upload build logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: hermes-aarch64-7.2-logs
          path: |
            spk/hermes/work-*/doctor.log
            spk/hermes/status-build.log
            spk/hermes/build-*.log
          if-no-files-found: warn